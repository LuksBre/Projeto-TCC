<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <title>
   Card&aacute;pio | Lucca Pizzeria
  </title>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="Lucca Pizzeria" name="description">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script defer src="js/app.js">
  </script>
 </head>
 <body class="cardapio-page">
  <header class="header container">
   <a class="brand" href="index.html">
    LUCCA
    <small>
     PIZZERIA
    </small>
   </a>
   <button aria-label="Abrir menu" class="menu-toggle">
    ☰
   </button>
   <nav class="main-nav">
    <a href="cardapio.html">
     CARD&Aacute;PIO
    </a>
    <a href="reservas.html">
     RESERVAS
    </a>
    <button aria-label="Abrir carrinho" class="cart-button" data-open-cart>
     🛍
     <span data-cart-count>
      0
     </span>
    </button>
   </nav>
  </header>
  <div class="header-line">
  </div>
  <main>
   <section class="page-title container">
    <h1>
     Nosso Card&aacute;pio
    </h1>
    <p>
     Sele&ccedil;&atilde;o especial de pizzas artesanais e sabores exclusivos
    </p>
   </section>
   <section class="menu-section container">
    <div aria-label="Filtrar card&aacute;pio" class="filters" role="group">
     <button class="active" data-filter="todos">
      Todos
     </button>
     <button data-filter="classicas">
      Cl&aacute;ssicas
     </button>
     <button data-filter="especiais">
      Especiais
     </button>
     <button data-filter="doces">
      Doces
     </button>
    </div>
    <div class="pizza-grid" data-product-grid>
    </div>
    <a class="primary back" href="index.html">
     Voltar ao in&iacute;cio
    </a>
   </section>
  </main>
  <footer>
   <div class="container footer-content">
    <span>
     &copy; 2026 Lucca Pizzeria
    </span>
    <nav>
     <a href="sobre.html">
      SOBRE
     </a>
     <a href="sobre.html#contato">
      CONTATO
     </a>
     <a href="localizacao.html">
      LOCALIZA&Ccedil;&Atilde;O
     </a>
     <a href="localizacao.html#trabalhe">
      TRABALHE CONOSCO
     </a>
    </nav>
    <div class="social">
     ◎ ● ◉
    </div>
   </div>
  </footer>
  <div class="cart-overlay" data-cart-overlay>
   <aside aria-labelledby="cart-title" aria-modal="true" class="cart-panel" role="dialog">
    <button aria-label="Fechar" class="close-cart" data-close-cart>
     &times;
    </button>
    <h2 id="cart-title">
     Seu pedido
    </h2>
    <div class="cart-items" data-cart-items>
    </div>
    <div class="cart-total">
     <span>
      Total
     </span>
     <strong data-cart-total>
      R$ 0,00
     </strong>
    </div>
    <label>
     Nome
     <input data-customer-name placeholder="Seu nome">
    </label>
    <button class="primary full" data-whatsapp>
     Finalizar no WhatsApp
    </button>
    <button class="text-button" data-clear-cart>
     Limpar carrinho
    </button>
   </aside>
  </div>
  <div class="toast" data-toast>
  </div>
 </body>
</html>
